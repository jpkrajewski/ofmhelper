# The site in front of the app: on the server /etc/nginx/sites-available/ofmhelpers
# (README "nginx + HTTPS"; certbot adds the TLS part there), on dev the `nginx`
# service of docker-compose.dev.yml, which mounts this very file. Where the app
# listens is the one thing that differs, so it is not in here: the upstream
# `ofmhelpers_app` is nginx/upstream.conf on the server, nginx/upstream.dev.conf
# on dev.
#
# No real domain in this file (public repo): set server_name on the server.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name example.com www.example.com;

    # Reel/video uploads go through this proxy; the default 1m would reject
    # anything real.
    client_max_body_size 2048m;
    # Generation jobs are enqueued, not served synchronously, but a slow
    # upstream should not be cut off mid-response either.
    proxy_read_timeout 600s;
    proxy_send_timeout 600s;

    location / {
        proxy_pass http://ofmhelpers_app;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Upgrade headers kept so a future websocket route works unchanged.
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_buffering off;
    }

    # CSS/JS links carry ?v=<content hash> (templates_config.static_url), so
    # browsers may keep them.
    location /static/ {
        proxy_pass http://ofmhelpers_app/static/;
        proxy_set_header Host $host;
        expires 7d;
        add_header Cache-Control "public";
    }
}
