# The site in front of the app: on the server /etc/nginx/sites-available/ofmhelpers
# (README "nginx + HTTPS"; certbot adds the TLS part there), on dev the `nginx`
# service of docker-compose.dev.yml, which mounts this very file. Where the app
# listens is the one thing that differs, so it is not in here: the upstream
# `ofmhelpers_app` is nginx/upstream.conf on the server, nginx/upstream.dev.conf
# on dev.
#
# No real domain in this file (public repo): set server_name on the server.

# The access log with how long each request took and how big it was: a slow
# upload is readable from it (prod 2026-11-16, a 115 MB /clone-long upload of
# 10-16 min: the default log has no timing at all). `rt` = seconds from the
# first byte read from the client to the last sent, `len` = request size.
log_format timed '$remote_addr - $remote_user [$time_local] "$request" '
                 '$status $body_bytes_sent "$http_referer" "$http_user_agent" '
                 'rt=$request_time len=$request_length urt=$upstream_response_time';

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name example.com www.example.com;
    access_log /var/log/nginx/access.log timed;

    # Reel/video uploads go through this proxy; the default 1m would reject
    # anything real.
    client_max_body_size 2048m;
    # Generation jobs are enqueued, not served synchronously, but a slow
    # upstream should not be cut off mid-response either.
    proxy_read_timeout 600s;
    proxy_send_timeout 600s;

    # HTTPS only from a visitor's first visit on (owner 2026-11-18: a day to
    # start, raised once it has run a while). Browsers take it from HTTPS
    # answers only, so on dev's plain http it is ignored. Never
    # includeSubDomains before every subdomain (go.) serves HTTPS. A
    # location with its own add_header (/static) does not inherit this.
    add_header Strict-Transport-Security "max-age=86400" always;

    location / {
        proxy_pass http://ofmhelpers_app;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Upgrade headers kept so a future websocket route works unchanged.
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_buffering off;
    }

    # CSS/JS links carry ?v=<content hash> (templates_config.static_url), so
    # browsers may keep them.
    location /static/ {
        proxy_pass http://ofmhelpers_app/static/;
        proxy_set_header Host $host;
        expires 7d;
        add_header Cache-Control "public";
    }
}
