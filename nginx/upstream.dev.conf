# Dev's (docker-compose.dev.yml `nginx`): the app by its compose service name,
# looked up again every 10 s through Docker's resolver, so a recreated app
# container (new address) is found without restarting nginx.
resolver 127.0.0.11 valid=10s;
upstream ofmhelpers_app {
    zone ofmhelpers_app 64k;
    server ofmhelpers:8000 resolve;
}
