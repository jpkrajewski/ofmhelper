{% extends "base.html" %}
{% block content %}
<div class="page-head">
    <h1>Download</h1>
</div>

<div class="generate-layout">
<div class="generate-form-col">
<h2 class="col-title">Fetch / clean</h2>

<form id="download-assets-form" method="post" action="/download-media/run" enctype="multipart/form-data"
      data-prefix="/download-media" data-result-kind="video">
    <div class="field">
        <label>Tool</label>
        <select id="tool-select">
            <option value="download_media" data-tasks="download_media download_videos download_images" data-action="/download-media/run" data-prefix="/download-media" data-result-kind="video">Download videos &amp; images</option>
            <option value="clean_images" data-action="/clean-images/run" data-prefix="/clean-images" data-result-kind="image">Clean image metadata</option>
        </select>
    </div>

    <fieldset class="tool-fields" data-tool="download_media">
        <div class="field">
            <label for="dl-urls">Links, one per line</label>
            <textarea id="dl-urls" name="urls" rows="6" required placeholder="https://www.tiktok.com/@user/video/123&#10;https://www.instagram.com/reel/abc123/&#10;https://www.instagram.com/p/abc123/"></textarea>
        </div>
    </fieldset>

    <fieldset class="tool-fields" data-tool="clean_images" disabled hidden>
        <div class="field">
            <label for="clean-files">Images</label>
            <input type="file" id="clean-files" name="files" multiple accept="image/*" required>
        </div>
    </fieldset>

    <button type="submit" class="btn-primary">Run</button>
</form>
</div>

<div class="generate-gallery-col">

<div id="results-panel">
    <div class="generation-status"></div>
    <div class="results" data-gallery-endpoint="/download-assets/gallery">
        {% for job in gallery %}{% include "_download_gallery_card.html" %}{% endfor %}
        {% include "_generate_gallery_sentinel.html" %}
    </div>
</div>
</div>
</div>

<script>
// Same pattern as /generate: only one tool's fieldset is shown/enabled at a
// time (`disabled` keeps FormData from submitting the inactive tools'
// same-named fields, display:none hides them).
document.getElementById('tool-select').addEventListener('change', (e) => {
    const option = e.target.selectedOptions[0];
    const form = document.getElementById('download-assets-form');
    form.action = option.dataset.action;
    form.dataset.prefix = option.dataset.prefix;
    form.dataset.resultKind = option.dataset.resultKind;

    document.querySelectorAll('.tool-fields').forEach((fieldset) => {
        const active = fieldset.dataset.tool === option.value;
        fieldset.disabled = !active;
        fieldset.hidden = !active;
    });
});

// ↻ Recreate: restore a past run's inputs. urls come back as a list ->
// rejoin one-per-line into the textarea. File uploads (clean images) can't
// be restored -- browsers don't allow setting a file input's value.
document.querySelector('#results-panel .results').addEventListener('click', (e) => {
    if (!e.target.closest('.recreate-btn')) return;
    const card = e.target.closest('.result-item[data-task]');
    if (!card) return;

    // A past Download videos / Download images run reopens in the one
    // Download tool that replaced both (its option lists them in data-tasks).
    const toolSelect = document.getElementById('tool-select');
    const task = card.dataset.task;
    const option = [...toolSelect.options].find(
        (o) => o.value === task || (o.dataset.tasks || '').split(' ').includes(task)
    );
    if (!option) return;
    toolSelect.value = option.value;
    toolSelect.dispatchEvent(new Event('change'));

    const params = JSON.parse(card.dataset.params || '{}');
    const fieldset = document.querySelector(`fieldset[data-tool="${option.value}"]`);
    for (const [key, value] of Object.entries(params)) {
        const field = fieldset.querySelector(`[name="${key}"]`);
        if (!field || field.type === 'file') continue;
        field.value = Array.isArray(value) ? value.join('\n') : value;
        field.dispatchEvent(new Event('input', { bubbles: true }));
    }
    document.getElementById('download-assets-form').scrollIntoView({ behavior: 'smooth' });
});
</script>
<script src="{{ static_url('js/generation.js') }}"></script>
<script src="{{ static_url('js/gallery-scroll.js') }}"></script>
{% endblock %}
