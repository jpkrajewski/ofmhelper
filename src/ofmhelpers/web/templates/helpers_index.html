{% extends "base.html" %}
{% block content %}
<div class="page-head">
    <h1>Helpers</h1>
    <p class="lead">Small standalone audio/media tools.</p>
</div>

<ul class="helper-list">
    {% for h in helpers %}
    <li>
        <a class="link-card" href="/helpers/{{ h.slug }}">
            <span class="link-card-title">{{ h.name }}</span>
            <span class="link-card-desc">{{ h.description }}</span>
        </a>
    </li>
    {% endfor %}
</ul>
{% endblock %}
