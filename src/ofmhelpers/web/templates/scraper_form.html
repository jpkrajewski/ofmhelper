{% extends "base.html" %}
{% block content %}
<div class="page-head">
    <h1>Profile Scraper</h1>
    <p class="lead">Upload a sheet with <code>INSTAGRAM_PROFILES</code> and <code>TIKTOK_PROFILES</code> columns.</p>
</div>

<form method="post" action="/helpers/scraper/run" enctype="multipart/form-data" class="card todo-add-form">
    <div class="field">
        <label for="scraper-keys">API keys (one per line — the client with the most credits is used)</label>
        <textarea name="api_keys" id="scraper-keys" required placeholder="apify_api_xxx&#10;apify_api_yyy"></textarea>
    </div>

    <div class="field">
        <label for="scraper-sheet">Profiles sheet (.xlsx)</label>
        <input type="file" name="sheet" id="scraper-sheet" accept=".xlsx" required>
    </div>

    <div class="field">
        <label for="scraper-count">Results per profile</label>
        <input type="number" name="results_per_profile" id="scraper-count" value="20" min="1">
    </div>

    <div class="field">
        <label for="scraper-days">Days back</label>
        <input type="number" name="results_days_back" id="scraper-days" value="7" min="1">
    </div>

    <button type="submit" class="btn-primary">Run scrape</button>
</form>
{% endblock %}
