{% extends "base.html" %}
{% block content %}
<h1>Add model</h1>
<p><a href="/models">← back to models</a></p>

<form method="post" action="/models/add" enctype="multipart/form-data" class="todo-add-form">
    <div class="field">
        <label>Name</label>
        <input type="text" name="name" required>
    </div>
    <div class="field">
        <label>OnlyFans link</label>
        <input type="text" name="onlyfans_url" placeholder="https://onlyfans.com/...">
    </div>
    <div class="field">
        <label>Profile picture</label>
        <input type="file" name="profile_picture" accept="image/*">
    </div>
    <button type="submit">Add model</button>
</form>
{% endblock %}
