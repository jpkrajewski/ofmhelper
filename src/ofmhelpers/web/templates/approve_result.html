<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="dark">
    <title>{{ "Approved" if ok else "Approval failed" }} — Global Ascend LLC</title>
    <link rel="stylesheet" href="/static/css/app.css">
</head>
<body>
    <main class="login-screen">
        <div class="login-card">
            <h1 class="login-logo">GLOBAL ASCEND</h1>
            <p class="login-sub">LLC · Content Ops Command Center</p>

            {% if ok %}
            <p class="notice notice-ok">✅ Approved — uploading to Google Drive now.</p>
            {% else %}
            <p class="login-error" role="alert">❌ {{ message }}</p>
            {% endif %}
        </div>
    </main>
</body>
</html>
