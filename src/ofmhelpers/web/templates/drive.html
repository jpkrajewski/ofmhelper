{% extends "base.html" %}
{% import "_icons.html" as ic %}
{% block title %}Drive — Ascend Global LLC{% endblock %}
{% block content %}
<div class="page-head ph-head">
    <div>
        <h1>Drive</h1>
    </div>
</div>

<div class="generation-status" id="dr-status" role="status" aria-live="polite"></div>

<div class="ph-toolbar">
    <label class="ph-search">
        {{ ic.icon("search") }}
        <input type="search" id="dr-search" placeholder="Search accounts, people, phones…" aria-label="Search accounts" autocomplete="off">
    </label>
    <div class="toolbar-actions">
        {% if board.root_url %}<a class="btn ph-btn" href="{{ board.root_url }}" target="_blank" rel="noopener">{{ ic.icon("folder") }} Open in Drive</a>{% endif %}
        <button type="button" class="btn-primary ph-btn" id="dr-sync" {% if board.problem and not board.cards %}disabled{% endif %}>{{ ic.icon("refresh") }} Sync</button>
    </div>
</div>

<div id="dr-board"{% if not board.live %} data-live="/drive/live"{% endif %}>
{% include "_drive_board.html" %}
</div>

<script src="{{ static_url('js/drive.js') }}"></script>
{% endblock %}
