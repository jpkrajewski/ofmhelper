{% extends "base.html" %}
{% block content %}
<div class="page-head">
    <h1>Radio Comms Modulator</h1>
    <p class="lead">Turns clean voice lines into crunchy radio comms.</p>
</div>

<form method="post" action="/helpers/radio-comms/run" enctype="multipart/form-data" class="card todo-add-form">
    <div class="field">
        <label for="rc-files">Input file(s) (.wav)</label>
        <input type="file" name="files" id="rc-files" accept="audio/*" multiple required>
    </div>

    <div class="field">
        <label for="rc-preset">Preset</label>
        <select name="preset" id="rc-preset">
            {% for p in presets|default([]) %}
            <option value="{{ p }}" {% if p == "cod_clean" %}selected{% endif %}>{{ p }}</option>
            {% endfor %}
        </select>
    </div>

    <div class="field">
        <label for="mode">Mode</label>
        <select name="mode" id="mode" onchange="toggleMode()">
            <option value="single">Single output per file</option>
            <option value="variations">Generate N randomized variations</option>
        </select>
    </div>

    <div id="variations-fields" style="display:none">
        <div class="field">
            <label for="rc-count">Variation count</label>
            <input type="number" name="count" id="rc-count" value="10" min="1" max="50">
        </div>
        <div class="field">
            <label for="rc-jitter">Jitter amount (0.0 - 1.0)</label>
            <input type="number" name="jitter_amount" id="rc-jitter" value="0.18" min="0" max="1" step="0.01">
        </div>
    </div>

    <div class="field">
        <label for="rc-seed">Seed (optional, for reproducibility)</label>
        <input type="number" name="seed" id="rc-seed">
    </div>

    <button type="submit" class="btn-primary">Process</button>
</form>

<script>
function toggleMode() {
    const mode = document.getElementById('mode').value;
    document.getElementById('variations-fields').style.display = mode === 'variations' ? 'block' : 'none';
}
</script>
{% endblock %}
