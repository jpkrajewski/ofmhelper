{# Shared look for the Models pages (list + edit): thumbnails, the pill
   button used for every action, the Instagram stats cards. Lives in one
   partial so the two pages cannot drift into two different designs. #}
<style>

    .model-thumb { width: 72px; height: 72px; border-radius: 50%; object-fit: cover; }
    .model-thumb-empty {
        display: inline-flex; align-items: center; justify-content: center;
        width: 72px; height: 72px; border-radius: 50%; font-size: 24px;
        background: var(--surface-2); color: var(--text-muted);
    }
    .model-name { font-size: 22px; font-weight: bold; }
    .model-contacts {
        display: flex; flex-direction: column; gap: 2px; margin-top: 6px;
        font-size: 13px; font-weight: normal; color: var(--text-muted);
    }
    .model-contact b { color: var(--text); font-weight: normal; }
    .model-link { font-size: 20px; }

    .model-toolbar {
        display: flex; flex-wrap: wrap; align-items: center;
        gap: 12px; margin: 0 0 22px;
    }
    .model-toolbar form { margin: 0; }
    .model-toolbar-note { color: var(--text-muted); font-size: 13px; max-width: 340px; }
    .model-refresh-status { font-size: 14px; color: var(--text-muted); }
    .model-refresh-status.is-done { color: var(--text); }
    .model-refresh-status.is-error { color: var(--fail); }
    .model-btn[disabled] { opacity: 0.55; cursor: progress; }

    table td { vertical-align: top; padding: 14px 12px; }

    .model-ig-links { display: flex; flex-direction: column; gap: 18px; }
    .model-ig-account {
        display: flex; flex-direction: column; gap: 8px;
        padding: 12px 14px; border: 1px solid var(--border); border-radius: 8px;
        background: var(--surface-2);
    }
    .model-ig-stats { color: var(--text-muted); }
    .model-ig-followers { font-size: 16px; font-weight: bold; color: var(--text); }
    .model-ig-stats-error { color: var(--fail); margin-left: 8px; }
    /* global.css styles every <table> full-width with a 20px top margin --
       fine for a page-level table, wrong for one nested in a cell. */
    .model-ig-posts { border-collapse: collapse; width: auto; margin: 8px 0 0; }
    .model-ig-posts th, .model-ig-posts td {
        border: 1px solid var(--border); padding: 6px 12px;
        font-size: 15px; text-align: right; white-space: nowrap;
    }
    .model-ig-posts th {
        font-size: 12px; text-transform: uppercase; letter-spacing: 0.04em;
        color: var(--text-muted); font-weight: normal;
    }
    .model-ig-posts td { font-variant-numeric: tabular-nums; }
    .model-ig-posts th:first-child, .model-ig-posts td:first-child { text-align: left; }
    .model-ig-posts td:first-child { font-size: 13px; }
    /* Wrap instead of overflowing a narrow column, and stretch so the <a>
       and the <button>s in this cell present one flush row of boxes. */
    .model-actions { display: flex; flex-wrap: wrap; gap: 8px; align-items: stretch; }
    .model-actions form { display: flex; margin: 0; }
    .model-actions .model-btn { width: 100%; text-align: center; }
    .model-btn {
        display: inline-flex; align-items: center; justify-content: center;
        box-sizing: border-box; padding: 7px 14px; margin: 0; cursor: pointer;
        border: 1px solid var(--border); border-radius: 6px;
        background: var(--surface-2); color: var(--text);
        /* <button> does not inherit the page font -- without this the Edit
           link and the Delete button render at different heights and their
           borders stop lining up. */
        font: inherit; font-size: 13px; line-height: 1.4; text-decoration: none;
    }
    .model-btn:hover { border-color: var(--accent); color: var(--accent-soft); }
    .model-refresh-btn { border-color: var(--accent); color: var(--accent-soft); }
    .model-delete-btn:hover { border-color: var(--fail); color: var(--fail); }
</style>
