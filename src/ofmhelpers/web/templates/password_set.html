<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="dark">
    <meta name="referrer" content="no-referrer">
    <title>Set your password — Ascend Global LLC</title>
    {% include "_favicon.html" %}
    <link rel="stylesheet" href="{{ static_url('css/app.css') }}">
</head>
<body>
    <main class="login-screen">
        <div class="login-card">
            <h1 class="login-logo">ASCEND GLOBAL</h1>
            <p class="login-sub">Set your password</p>

            {% if error %}
            <p class="login-error" role="alert">{{ error }}</p>
            {% endif %}

            {% if user %}
            <form method="post">
                <div class="field">
                    <label for="email">Email</label>
                    <input type="text" id="email" value="{{ user.email }}" autocomplete="username" readonly>
                </div>
                <div class="field">
                    <label for="password">New password</label>
                    <input type="password" name="password" id="password" required minlength="{{ min_length }}"
                           autocomplete="new-password">
                </div>
                <div class="field">
                    <label for="confirm">Again</label>
                    <input type="password" name="confirm" id="confirm" required minlength="{{ min_length }}"
                           autocomplete="new-password">
                </div>
                <p class="login-help">At least {{ min_length }} characters. The link works once.</p>
                <button type="submit" class="login-btn">Set password and sign in</button>
            </form>
            {% else %}
            <a class="login-btn login-provider" href="/login">Go to sign in</a>
            {% endif %}
        </div>
    </main>
</body>
</html>
