{# The actions rows of a gallery card (_gallery_card.html), as templates
   generation.js clones for a run that finishes while the page is open: one
   markup, from the same macros, for a reloaded and a live card. Included
   by every page that loads generation.js. #}
{% import "components/ui.html" as ui %}
<template id="card-actions-done"><div class="result-actions">
    {{ ui.button("Download", href="#", icon="download", hook="download-btn") }}
    {% call ui.menu("More actions") %}{{ ui.menu_item("Recreate", "restore", "recreate-btn") }}{% endcall %}
</div></template>
<template id="card-actions-failed"><div class="result-actions">
    {{ ui.button("Recreate", icon="restore", hook="recreate-btn") }}
</div></template>
