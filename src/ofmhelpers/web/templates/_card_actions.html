{% import "components/ui.html" as ui %}
{% import "_card_hide.html" as hide %}
{% set may_hide = can(request, "hide") %}
<template id="card-actions-done"><div class="result-actions">
    {{ ui.button("Download", href="#", icon="download", hook="download-btn") }}
    {% call ui.menu("More actions") %}{{ ui.menu_item("Recreate", "restore", "recreate-btn") }}{% if may_hide %}{{ hide.items() }}{% endif %}{% endcall %}
</div></template>
<template id="card-actions-failed"><div class="result-actions">
    {{ ui.button("Recreate", icon="restore", hook="recreate-btn") }}
    {% if may_hide %}{% call ui.menu("More actions") %}{{ hide.items() }}{% endcall %}{% endif %}
</div></template>
{% if can(request, "account") %}<template id="card-failed-keys"><a class="result-failed-fix" href="/account">API keys</a></template>{% endif %}
<template id="card-failed-more">{{ ui.button("", block=true, hook="failed-more") }}</template>
