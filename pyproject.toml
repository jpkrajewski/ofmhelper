[project]
name = "ofmhelpers"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "apify-client>=3.1.0",
    "bgutil-ytdlp-pot-provider>=1.3.1",
    "elevenlabs>=2.59.0",
    "fastapi>=0.140.0",
    "gallery-dl>=1.32.8",
    "google-api-python-client>=2.198.0",
    "google-auth>=2.56.2",
    "google-auth-oauthlib>=1.4.0",
    "google-genai>=2.14.0",
    # Not imported directly: Starlette's SessionMiddleware (web/main.py) signs
    # the session cookie with it, and Jinja2Templates (web/templates_config.py)
    # renders every page. Both fail at runtime, not import time, if dropped.
    "itsdangerous>=2.2.0",
    "jinja2>=3.1.6",
    "openpyxl>=3.1.5",
    "pillow>=12.3.0",
    # Free, in-house Instagram scraping (followers + last-3-posts stats) --
    # no login, no paid Apify actor. See scraping/instagram_public.py.
    "playwright>=1.48.0",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.2",
    "pytest>=9.1.1",
    "python-multipart>=0.0.32",
    "requests>=2.34.2",
    "scipy>=1.18.0",
    "soundfile>=0.14.0",
    "uvicorn>=0.51.0",
    "yt-dlp>=2026.7.4",
    # Ships the JS runtime yt-dlp's "ejs:github" remote component needs
    # (downloaders/generic.py); imported by yt-dlp, never by us.
    "yt-dlp-ejs>=0.8.0",
    "sqlalchemy>=2.0.51",
    "alembic>=1.18.5",
    "psycopg[binary]>=3.3.4",
    "redis>=8.0.1",
    "rq>=2.10.0",
    "rq-dashboard>=0.9.0",
]

[dependency-groups]
dev = [
    "httpx2>=2.9.1",
    "mypy>=2.3.0",
    "pre-commit>=4.6.1",
    "ruff>=0.16.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ofmhelpers"]

[tool.mypy]
python_version = "3.12"
# Third-party stubs are for a stricter API than these libraries actually
# accept at runtime, and several deps ship none at all; neither is a defect in
# this code.
ignore_missing_imports = true
# The pre-commit hook checks staged files only (see .pre-commit-config.yaml).
files = ["src/ofmhelpers"]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    # Formatter owns layout; these fight `ruff format`.
    "COM812",
    "E501",
    # No copyright headers in this repo.
    "CPY001",
    # Docstrings and annotations are used where they earn their keep; this
    # codebase documents modules/classes, not every helper signature.
    "D",
    "ANN",
    # stdout IS the log here (Docker captures it). Note ruff's T201 fix
    # DELETES the print rather than converting it -- never autofix this.
    "T201",
    # Deferred imports are deliberate: heavy deps (playwright, yt-dlp) must
    # not be paid for at module import time, and a few break an import cycle.
    "PLC0415",
    # ffmpeg/ffprobe/yt-dlp run with fixed argv lists, never shell=True.
    "S603",
    "S607",
    # Arity/complexity metrics. Route handlers and generation wrappers mirror
    # their API contracts one-parameter-per-field; collapsing them into config
    # objects is a refactor with no correctness payoff.
    "PLR0911",
    "PLR0912",
    "PLR0913",
    "PLR0915",
    "PLR0917",
    "C901",
    # Boolean flags here are form/query fields and provider knobs, not
    # call-site readability traps.
    "FBT001",
    "FBT002",
    # Deliberate fault isolation at external boundaries: a job runner, an
    # API-key sweep loop, or a per-post parse must record the failure and
    # keep going rather than take the worker down. Every site does something
    # with the exception (logs it, stores it on the job, falls back).
    "BLE001",
]

[tool.ruff.lint.flake8-unused-arguments]
# `_`-prefixed params are the signal for "required by the interface, unused".
ignore-variadic-names = true

[tool.ruff.lint.per-file-ignores]
# The analysis prompt is stored verbatim -- its en dashes and other typography
# are part of the exact text sent to the model, not a typo to normalize.
"src/ofmhelpers/reel_machine/prompts.py" = ["RUF001"]
# Tests: asserts are the point, fixtures shadow names, magic values are data,
# and the "passwords" are dummy env values.
"tests/**" = [
    "S101",              # asserts are the entire point
    "PLR2004",           # expected values are literals by nature
    "ARG001", "ARG005",  # stub/monkeypatch signatures ignore args
    "SLF001",            # tests verify private state directly
    "INP001",            # pytest collects these without __init__.py
    "S105", "S106", "S107", "S108",  # dummy creds and fake /tmp paths
    "N806",              # `MockClient = ...` locals hold classes
    "PLC0415",           # deferred imports inside tests are deliberate
    "PT011", "PT019", "RUF043",
    "BLE001", "PTH123", "RUF012", "S603", "S607", "SIM117", "FBT002",
]
# Lazy singletons that rebuild when the configured URL changes -- `global`
# is inherent to the pattern.
"src/ofmhelpers/web/queue.py" = ["PLW0603"]
"src/ofmhelpers/web/db/session.py" = ["PLW0603"]
# Same: a once-per-process "already configured" flag.
"src/ofmhelpers/log.py" = ["PLW0603"]
# LLM providers implement a shared protocol; a given backend legitimately
# ignores inputs another one uses (TemplateProvider is deterministic and
# reads none of them). Renaming would break the positional callers.
"src/ofmhelpers/reel_machine/llm/*.py" = ["ARG002"]
# `lifespan(app)` is Starlette's required signature.
"src/ofmhelpers/web/main.py" = ["ARG001"]
# DSP helpers share one (audio, sr, ...) positional shape by design.
"src/ofmhelpers/utils/radio_comms_fx.py" = ["ARG001"]
# Standalone scripts and migrations aren't importable packages.
"scripts/**" = ["INP001"]
"alembic/**" = ["INP001"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.format]
docstring-code-format = true
