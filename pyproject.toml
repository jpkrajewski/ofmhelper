[project]
name = "ofmhelpers"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "bgutil-ytdlp-pot-provider>=2.0.2",
    "fastapi>=0.143.3",
    "gallery-dl>=1.32.16",
    # Not imported directly: Starlette's SessionMiddleware (web/main.py) signs
    # the session cookie with it, and Jinja2Templates (web/templates_config.py)
    # renders every page. Both fail at runtime, not import time, if dropped.
    "itsdangerous>=2.2.0",
    "jinja2>=3.1.6",
    "pillow>=12.3.0",
    "pydantic>=2.14.1",
    "pydantic-settings>=2.16.0",
    "pytest>=9.1.1",
    "python-multipart>=0.0.32",
    "requests>=2.34.2",
    "uvicorn>=0.54.0",
    "yt-dlp>=2026.8.19",
    # Ships the JS runtime yt-dlp's "ejs:github" remote component needs
    # (downloaders/generic.py); imported by yt-dlp, never by us.
    "yt-dlp-ejs>=0.8.0",
    "sqlalchemy>=2.0.51",
    "alembic>=1.18.5",
    "psycopg[binary]>=3.3.4",
    "redis>=8.0.1",
    "rq>=2.10.0",
    "rq-dashboard>=0.9.0",
    "pillow-heif>=1.8.1",
    "higgsfield-client>=0.2.0",
    "jsonschema>=4.23",
    # Fernet for the /phones vault (web/db/encrypted.py): logins and backup
    # codes are encrypted at rest. >=50.0.0: CVE-2026-69247 and older fixes.
    "cryptography>=50.0.0",
    # /phones Excel export (web/exports/devices_xlsx.py), write-only.
    "openpyxl>=3.1.5",
    # /drive (ofmhelpers/gdrive): the shared Google Drive folder, as a
    # service account. google-auth also gives the authorised thumbnail fetch.
    "google-api-python-client>=2.201.0",
    "google-auth>=2.40.0",
]

[dependency-groups]
dev = [
    "allure-pytest>=2.16.2",
    "djlint>=1.36",
    "httpx2>=2.9.1",
    "mypy>=2.3.0",
    # Browser for tests/e2e (uv run playwright install chromium).
    "playwright>=1.64.0",
    "pre-commit>=4.6.1",
    "pytest-json-report>=1.5.0",
    "pytest-repeat>=0.9.4",
    "pytest-socket>=0.8.1",
    "pytest-xdist>=3.8.0",
    "responses>=0.26.3",
    "ruff>=0.16.0",
    "time-machine>=3.5.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ofmhelpers"]

[tool.mypy]
python_version = "3.12"
# The code runs only on Linux (Docker, the server); the pre-commit hook may
# run mypy on a Windows host, where Linux-only modules (fcntl) do not exist.
platform = "linux"
# Third-party stubs are for a stricter API than these libraries actually
# accept at runtime, and several deps ship none at all; neither is a defect in
# this code.
ignore_missing_imports = true
# The pre-commit hook checks staged files only (see .pre-commit-config.yaml).
files = ["src/ofmhelpers"]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    # Checks run in Docker against a bind-mounted checkout; from a Windows host
    # every file shows up executable there, so this would flag every file.
    "EXE002",
    # Formatter owns layout; these fight `ruff format`.
    "COM812",
    "E501",
    # No copyright headers in this repo.
    "CPY001",
    # Docstrings and annotations are used where they earn their keep; this
    # codebase documents modules/classes, not every helper signature.
    "D",
    "ANN",
    # stdout IS the log here (Docker captures it). Note ruff's T201 fix
    # DELETES the print rather than converting it -- never autofix this.
    "T201",
    # Deferred imports are deliberate: heavy deps (yt-dlp) must
    # not be paid for at module import time, and a few break an import cycle.
    "PLC0415",
    # ffmpeg/ffprobe/yt-dlp run with fixed argv lists, never shell=True.
    "S603",
    "S607",
    # Arity/complexity metrics. Route handlers and generation wrappers mirror
    # their API contracts one-parameter-per-field; collapsing them into config
    # objects is a refactor with no correctness payoff.
    "PLR0911",
    "PLR0912",
    "PLR0913",
    "PLR0915",
    "PLR0917",
    "C901",
    # Boolean flags here are form/query fields and provider knobs, not
    # call-site readability traps.
    "FBT001",
    "FBT002",
    # Deliberate fault isolation at external boundaries: a job runner, an
    # API-key sweep loop, or a per-post parse must record the failure and
    # keep going rather than take the worker down. Every site does something
    # with the exception (logs it, stores it on the job, falls back).
    "BLE001",
]

[tool.ruff.lint.flake8-unused-arguments]
# `_`-prefixed params are the signal for "required by the interface, unused".
ignore-variadic-names = true

[tool.ruff.lint.per-file-ignores]
# Tests: asserts are the point, fixtures shadow names, magic values are data,
# and the "passwords" are dummy env values.
"tests/**" = [
    "S101",              # asserts are the entire point
    "PLR2004",           # expected values are literals by nature
    "ARG001", "ARG005",  # stub/monkeypatch signatures ignore args
    "SLF001",            # tests verify private state directly
    "INP001",            # pytest collects these without __init__.py
    "S105", "S106", "S107", "S108",  # dummy creds and fake /tmp paths
    "N806",              # `MockClient = ...` locals hold classes
    "PLC0415",           # deferred imports inside tests are deliberate
    "PT011", "PT019", "RUF043",
    "BLE001", "PTH123", "RUF012", "S603", "S607", "SIM117", "FBT002",
]
# Lazy singletons that rebuild when the configured URL changes -- `global`
# is inherent to the pattern.
"src/ofmhelpers/cache/redis.py" = ["PLW0603"]
"src/ofmhelpers/web/db/session.py" = ["PLW0603"]
# Same: a once-per-process "already configured" flag.
"src/ofmhelpers/log.py" = ["PLW0603"]
# `lifespan(app)` is Starlette's required signature.
"src/ofmhelpers/web/main.py" = ["ARG001"]
# DSP helpers share one (audio, sr, ...) positional shape by design.
"src/ofmhelpers/utils/radio_comms_fx.py" = ["ARG001"]
# Standalone scripts and migrations aren't importable packages.
"scripts/**" = ["INP001"]
"alembic/**" = ["INP001"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.format]
docstring-code-format = true

[tool.pytest.ini_options]
# Applied by folder in tests/conftest.py (tests/<kind>/); `live`, `slow`
# and `snapshot` are set per test.
markers = [
    "unit: pure logic -- no database, no network, no files beyond tmp_path (tests/unit)",
    "integration: the app through TestClient on the real test DB, every outside service faked (tests/integration)",
    "contract: one behaviour checked on a fake and, under -m live, on the real service (tests/contract)",
    "e2e: Playwright against the app the suite starts, with fakes (tests/e2e); scripts/test.sh e2e",
    "live: reaches a REAL outside service (Drive sandbox, AI providers, Instagram, proxies); scripts/test.sh live",
    "slow: takes more than 2 s (ffmpeg, real media)",
    "snapshot: migrations on a copy of the production snapshot; scripts/test.sh snapshot",
]
# A plain `pytest` is fast and offline: no browser, no real services, no
# production data; a later -m on the command line wins. Sockets: only the
# local app, Postgres and Redis (pytest-socket); `live` tests are let out,
# unit tests get none at all.
addopts = [
    "--strict-markers",
    "-m", "not e2e and not live and not snapshot",
    "--disable-socket",
    "--allow-unix-socket",
    "--allow-hosts=127.0.0.1,localhost,::1,postgres,redis",
]

# HTML/Jinja templates: `djlint src/ofmhelpers/web/templates --lint`.
[tool.djlint]
profile = "jinja"
# J018 url_for: routes are plain paths here, no named-route registry.
# H052 meta refresh: action log and job pages refresh on purpose.
# H023 &#10;: the only way to put a line break in a placeholder/title.
# H030/H031 meta description/keywords: internal tool, not indexed.
ignore = "J018,H052,H023,H030,H031"
# Inline style only where the value is data (a batch's hue) or the page is
# deliberately self-contained (the public landing page).
per-file-ignores = { "reachmodel.html" = "H021", "_clone_batch.html" = "H021" }
