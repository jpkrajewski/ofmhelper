name: CI

# Runs on every push to dev/main and on every PR into them. This is the gate
# the deploy workflow waits for -- main is only ever deployed after this has
# gone green on the same commit.
on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]
  workflow_dispatch:

# A second push to the same branch cancels the first: no point burning a
# runner on a commit that's already superseded. Never cancel on main, whose
# runs gate the deploy.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  # uv resolves from the lockfile; fail rather than silently re-resolving if
  # uv.lock and pyproject.toml have drifted apart.
  UV_FROZEN: "1"

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dev dependencies
        run: uv sync --group dev

      # Two separate steps, not `pre-commit run`: the failure that shows up in
      # the Actions UI should say which one broke.
      - name: ruff check
        run: uv run ruff check --output-format=github

      - name: ruff format
        run: uv run ruff format --check

  test:
    name: Tests (pytest)
    runs-on: ubuntu-latest

    # The exact local setup (CLAUDE.md "Validation"): the Dockerfile's `test`
    # stage -- the same ffmpeg/exiftool versions the export fixtures were
    # made with -- against the compose Postgres/Redis, pinned to what prod
    # runs. A runner's own apt tools differ (Ubuntu's exiftool names Keys
    # tags differently), so nothing runs on the runner itself.
    env:
      COMPOSE: docker compose -f docker-compose.yml -f docker-compose.dev.yml

    steps:
      - uses: actions/checkout@v4

      # No .env exists on a runner (it's gitignored), and that's the point:
      # this proves the app doesn't quietly depend on a developer's local
      # secrets file. Compose only needs the file to exist.
      - name: Empty .env
        run: touch .env

      - name: Build test image
        run: $COMPOSE --profile test build tests

      - name: Run tests
        run: $COMPOSE run --rm tests

      # TikTok, Instagram, kie.ai and Higgsfield reached for real (DNS, TLS
      # and each API's answer, tests/integration). No secret needed: the paid
      # APIs are called with a key they must reject.
      - name: Live services (integration)
        run: $COMPOSE run --rm tests uv run --frozen pytest -m integration -q

  build:
    name: Docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # Build only -- the image isn't pushed anywhere. The server builds its
      # own image on deploy (docker compose up -d --build), so this exists to
      # catch a broken Dockerfile before that happens in production.
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # A single job for branch protection / the deploy workflow to key off,
  # instead of having to list every job above by name in two places.
  ci-passed:
    name: CI passed
    runs-on: ubuntu-latest
    needs: [lint, test, build]
    if: always()
    steps:
      - name: Verify all checks succeeded
        run: |
          echo "lint:  ${{ needs.lint.result }}"
          echo "test:  ${{ needs.test.result }}"
          echo "build: ${{ needs.build.result }}"
          if [ "${{ needs.lint.result }}" != "success" ] || \
             [ "${{ needs.test.result }}" != "success" ] || \
             [ "${{ needs.build.result }}" != "success" ]; then
            echo "::error::One or more CI jobs failed"
            exit 1
          fi
          echo "All CI checks passed."
