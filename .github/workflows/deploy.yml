name: Deploy

# Deploys main to the production server over SSH. Mirrors what
# scripts/deploy.sh does by hand (checkout -> build -> stop app -> up, where
# compose runs `migrate` to completion before the app starts -> health check);
# the script stays the manual escape hatch.
#
# workflow_run, not a push trigger: the deploy must wait for CI. Its known
# risk (a fork's PR run from a branch it named `main` triggers this with the
# SSH key) is closed by the job's `if:`, which takes only this repository's
# own non-PR runs.
on: # zizmor: ignore[dangerous-triggers]
  workflow_run:
    workflows: [CI]
    branches: [main]
    types: [completed]
  # Manual re-deploy (e.g. after fixing something on the server itself), or a
  # rollback: an earlier commit of main, run from its kept image when the
  # server still has it (README "Deploying").
  workflow_dispatch:
    inputs:
      sha:
        description: "Commit of main to deploy (7-40 hex). Empty: origin/main."
        required: false
        type: string
        default: ""

# Never two deploys at once: they'd race on `git pull` and `docker compose
# up` in the same directory. Queue instead of cancelling -- cancelling
# mid-deploy could leave the stack half-rebuilt.
concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy to production
    runs-on: ubuntu-24.04
    # Gate on CI having actually passed for this commit. Without this, a red
    # main build would still deploy. Never a pull_request run, and only this
    # repository's: `branches: [main]` matches a fork PR's head branch too.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event != 'pull_request' &&
       github.event.workflow_run.head_repository.full_name == github.repository)

    # Attach a GitHub Environment so you can add a required reviewer or
    # restrict which branches may deploy in repo settings if you ever want a
    # second gate. Also where the URL shows up in the Actions UI.
    environment:
      name: production

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Fail with a clear message now, rather than an opaque ssh error later.
      - name: Check required secrets are set
        env:
          HOST: ${{ secrets.OFM_DEPLOY_HOST }}
          DIR: ${{ secrets.OFM_DEPLOY_DIR }}
          KEY: ${{ secrets.OFM_DEPLOY_SSH_KEY }}
        run: |
          missing=""
          [ -n "$HOST" ] || missing="$missing OFM_DEPLOY_HOST"
          [ -n "$DIR" ]  || missing="$missing OFM_DEPLOY_DIR"
          [ -n "$KEY" ]  || missing="$missing OFM_DEPLOY_SSH_KEY"
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secret(s):$missing"
            echo "Add them under Settings > Secrets and variables > Actions."
            exit 1
          fi

      - name: Configure SSH
        env:
          KEY: ${{ secrets.OFM_DEPLOY_SSH_KEY }}
          HOST: ${{ secrets.OFM_DEPLOY_HOST }}
          KNOWN_HOSTS: ${{ secrets.OFM_DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy

          hostname="${HOST#*@}"
          if [ -n "$KNOWN_HOSTS" ]; then
            # Preferred: pin the host key so a MITM'd DNS entry can't
            # silently receive a deploy.
            printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          else
            echo "::warning::OFM_DEPLOY_KNOWN_HOSTS not set -- trusting the \
            host key on first use. Add it (ssh-keyscan <host>) to pin it."
            # Never `|| true` here: an empty known_hosts makes every later ssh
            # fail with an unrelated host-key error. A keyscan that returns
            # nothing means the server is unreachable -- which is exactly what
            # happened when the old box went dark on 2026-09-20 and the job
            # died on a bare `exit 1` with no explanation.
            ssh-keyscan -H "$hostname" > ~/.ssh/known_hosts 2>/dev/null || true
            if [ ! -s ~/.ssh/known_hosts ]; then
              echo "::error::ssh-keyscan got no host key from '$hostname' -- \
              the server is unreachable on port 22 (dead host? wrong \
              OFM_DEPLOY_HOST? firewall?). Check the host, then set \
              OFM_DEPLOY_KNOWN_HOSTS to pin its key."
              exit 1
            fi
          fi
          chmod 600 ~/.ssh/known_hosts

      - name: Deploy
        env:
          HOST: ${{ secrets.OFM_DEPLOY_HOST }}
          DIR: ${{ secrets.OFM_DEPLOY_DIR }}
          # Deploy the exact commit CI went green on, not whatever origin/main
          # points at by the time this job runs -- a push landing mid-run would
          # otherwise ship an untested commit. On workflow_dispatch: the sha
          # typed in, or empty, where the remote falls back to origin/main.
          SHA: ${{ github.event.workflow_run.head_sha || inputs.sha }}
        run: |
          set -euo pipefail
          # It goes into the ssh command line below: nothing but a sha.
          if [ -n "$SHA" ] && ! [[ "$SHA" =~ ^[0-9a-f]{7,40}$ ]]; then
            echo "::error::Not a commit sha (7-40 hex characters): $SHA"
            exit 1
          fi
          # Same sequence as scripts/deploy.sh. `set -e` inside the remote
          # shell too, so a failed migration fails the job instead of being
          # masked by the next command's exit code.
          # A single-quoted variable, not a heredoc: inside a YAML block
          # scalar every line is indented, and bash does not recognise an
          # indented heredoc terminator -- it would swallow the rest of the
          # step. Single quotes keep $1/$(pwd) for the REMOTE shell to expand.
          remote_script='
            set -eu
            cd "$1"
            target="${2:-}"

            # Always the production file only. A dev overlay must never take
            # effect here, whatever happens to be sitting in the checkout.
            compose="docker compose -f docker-compose.yml"

            echo "== fetching =="
            git fetch origin main
            [ -n "$target" ] || target=$(git rev-parse origin/main)
            # Never a commit that is not on main (it did not go through CI).
            if ! git merge-base --is-ancestor "$target" origin/main; then
              echo "$target is not a commit of origin/main: not deployed" >&2
              exit 1
            fi
            echo "deploying $target"
            # The release running now: its image is the one kept for a rollback.
            running=$($compose ps -q ofmhelpers | head -n 1)
            previous=""
            [ -z "$running" ] || previous=$(docker inspect --format "{{.Config.Image}}" "$running")

            # Safe now that production runs the code baked into the image: the
            # checkout changes nothing until the swap at the end, so the old
            # container keeps serving old code against the old schema.
            echo "== checking out =="
            git reset --hard "$target"
            # Names the image (ofmhelpers-app:<sha>, docker-compose.yml) and
            # tags every trace with the commit (compose passes it to the app).
            OFM_RELEASE=$(git rev-parse --short HEAD)
            export OFM_RELEASE
            release="ofmhelpers-app:$OFM_RELEASE"

            # A commit whose image is still here (a rollback, a re-deploy) is
            # not built again: the same artifact runs, not a rebuild of it.
            echo "== building $release =="
            docker image inspect "$release" >/dev/null 2>&1 || $compose build ofmhelpers worker sweeps preview-worker media-worker edit-worker migrate

            echo "== swapping in the new containers =="
            # --remove-orphans: a service taken out of the compose file (clone-links-worker,
            # events-worker, 2026-11-11) would run on with the old code, next to the new.
            $compose up -d --remove-orphans postgres redis pot-provider
            # Old code never runs against the new schema: the app and workers
            # stop before `migrate` touches it (seconds of downtime; the build
            # is already done). Compose then runs `migrate` (alembic upgrade
            # head, off the image just built) to completion and starts the app
            # and workers only once it exited 0 -- a failed migration leaves
            # them down instead of serving a half-migrated database.
            # --force-recreate: a deploy that leaves the old containers running
            # while reporting success is the worst possible outcome. --no-deps
            # so this does not bounce the database underneath them.
            # Workers first, while the app still serves: each finishes the job
            # it runs (stop_grace_period, up to 120 s) and takes no new one;
            # jobs queued meanwhile wait in Redis for the new workers.
            # The sweeps with them: nothing queues new work or judges a
            # draining job cut off while the workers stop.
            echo "== stopping the workers =="
            $compose stop sweeps worker preview-worker media-worker edit-worker
            echo "== stopping the app =="
            $compose stop ofmhelpers
            echo "== migrating, then starting the app =="
            $compose up -d --no-deps --force-recreate migrate ofmhelpers worker sweeps preview-worker media-worker edit-worker
            $compose logs migrate

            # Two releases stay on the disk: this one and the one it replaced
            # (what a rollback runs: this workflow with a sha, or
            # `scripts/deploy.sh <sha>`). Older ones go. A re-deploy of the
            # running release replaces nothing, so nothing is removed then.
            # `image prune` takes untagged images only.
            if [ "$previous" != "$release" ]; then
              for image in $(docker image ls ofmhelpers-app --format "{{.Repository}}:{{.Tag}}"); do
                [ "$image" = "$release" ] || [ "$image" = "$previous" ] || docker image rm "$image" >/dev/null || true
              done
            fi
            docker image prune -f >/dev/null
            # Each build also strands ~1GB of build cache (new .venv layer).
            # Only layers used in the last day are kept (the layers of this build, so
            # the next rebuild stays fast): `--max-used-space 5gb` left 8 GB
            # on Docker 29 (prod 2026-11-08, disk at 93%), and a few days of
            # deploys would keep as much.
            docker builder prune -af --filter until=24h >/dev/null

            echo "== deployed =="
            $compose ps
            # The health check step asks the web app only. The sweeps and the
            # workers must be up too: a crash at their start (restart:
            # unless-stopped) would otherwise be a green deploy with recovery,
            # scans and every queue dead.
            sleep 20
            for service in sweeps worker preview-worker media-worker edit-worker; do
              id=$($compose ps -q "$service" | head -n 1)
              state=""
              [ -z "$id" ] || state=$(docker inspect --format "{{.State.Status}} {{.RestartCount}}" "$id")
              if [ "$state" != "running 0" ]; then
                echo "::error::$service is not up after the deploy: ${state:-no container}"
                $compose logs --tail 40 "$service" >&2 || true
                exit 1
              fi
            done
            echo "== sweeps and workers up =="
          '
          # The script is delivered as a FILE, not piped into `bash -s`. Piping
          # it makes bash read the script from stdin as it goes, so the first
          # command that touches stdin -- `docker compose run` does -- swallows
          # the remaining lines and bash exits 0 at EOF. That silently skipped
          # `up -d` on 2026-07-27 while the job reported success.
          ssh -i ~/.ssh/id_deploy -o BatchMode=yes "$HOST" \
            "cat > /tmp/ofm-deploy.sh && bash /tmp/ofm-deploy.sh '$DIR' '$SHA'; \
             rc=\$?; rm -f /tmp/ofm-deploy.sh; exit \$rc" <<< "$remote_script"

      - name: Health check
        env:
          HOST: ${{ secrets.OFM_DEPLOY_HOST }}
        run: |
          set -euo pipefail
          # 20 x 5s: the app now starts from a cold container on every deploy
          # (it used to be already up by the time this ran), so give it room.
          for i in $(seq 20); do
            status=$(ssh -i ~/.ssh/id_deploy -o BatchMode=yes "$HOST" \
              "curl -s -o /dev/null -w '%{http_code}' http://localhost:8000/health" \
              2>/dev/null) || true
            status="${status:-000}"
            if [ "$status" = "200" ]; then
              echo "Health check OK (200) after $i attempt(s)."
              exit 0
            fi
            echo "Attempt $i: got $status, retrying in 5s..."
            sleep 5
          done
          echo "::error::Health check failed -- the app is not serving 200 on /health."
          exit 1

      - name: Report container state on failure
        if: failure()
        env:
          HOST: ${{ secrets.OFM_DEPLOY_HOST }}
          DIR: ${{ secrets.OFM_DEPLOY_DIR }}
        run: |
          # Deploy failures are usually obvious from the logs; pull them into
          # the run output so you don't have to SSH in to find out why.
          remote_script='
            cd "$1"
            compose="docker compose -f docker-compose.yml"
            echo "== docker compose ps =="
            $compose ps -a
            echo "== last 100 log lines =="
            $compose logs --tail=100 migrate ofmhelpers worker sweeps preview-worker media-worker edit-worker
          '
          # Delivered as a file for the same reason as the deploy step: piping
          # into `bash -s` lets the first stdin-reading command swallow the
          # rest of the script.
          ssh -i ~/.ssh/id_deploy -o BatchMode=yes "$HOST" \
            "cat > /tmp/ofm-report.sh && bash /tmp/ofm-report.sh '$DIR'; \
             rm -f /tmp/ofm-report.sh" <<< "$remote_script" || true

      - name: Clean up SSH key
        if: always()
        run: rm -f ~/.ssh/id_deploy
