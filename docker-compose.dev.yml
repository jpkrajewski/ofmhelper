# LOCAL DEVELOPMENT overlay for docker-compose.yml. Never used on the server.
#
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d postgres redis   # just what pytest needs
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml --profile dev up -d rq-dashboard
#
# Not named docker-compose.override.yml on purpose: an auto-loaded overlay
# would also be picked up by a bare `docker compose` run on the production
# server, which is exactly the hot-reload-in-prod setup that caused the
# 2026-07-27 /models outage. Explicit flags cost a few characters and make the
# failure mode "dev acts like prod" instead of "prod acts like dev".
#
# What this adds on top of the production stack:
#   - ./src bind-mounted into the API and workers, so edits are visible without
#     a rebuild (`docker compose ... restart worker clone-links-worker` picks
#     them up; the API reloads itself).
#   - uvicorn --reload for the API.
#   - 2-process RQ pools instead of the production 10 (default queue) and 5
#     (clone-links).
#   - postgres/redis published on 127.0.0.1 for host-run `uv run pytest`.
#   - rq-dashboard, behind the `dev` profile so it stays off unless asked for.
#   - `migrate` reading ./src and ./alembic, so `up -d` applies the working
#     tree's migrations before the app starts.

# Docker Desktop's DNS proxy intermittently answers "no address" for names
# that also have an IPv6 record (www.instagram.com, www.tiktok.com,
# api.kie.ai -- 2026-10-19, it failed every download and upload of the
# worker). The containers' embedded resolver still answers service names
# (postgres, redis); everything else is forwarded to these instead.
# Prod is Linux Docker, which has no such proxy, so the base file sets none.
x-dns: &public-dns
  - 1.1.1.1
  - 8.8.8.8

services:
  ofmhelpers:
    # The image's CMD is the production one (no --reload) -- override it here
    # rather than baking a dev flag into the image.
    command:
      - uvicorn
      - ofmhelpers.web.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --reload
      - --reload-dir
      - /app/src
    dns: *public-dns
    volumes:
      # Merged with (not replacing) the base file's volume list.
      - ./src:/app/src

  worker:
    # No reloader: RQ's worker pool forks per job, and a reloader restarting it
    # mid-job would leave the job row stuck at "running". Restart it by hand
    # after changing worker-side code.
    environment:
      # 2 instead of the production 10: locally the pool is 10 idle Python
      # processes competing for the same laptop, and startup/restart is the
      # slow part of the dev loop. Bump if you need real concurrency here.
      - OFM_RQ_WORKERS=2
    dns: *public-dns
    volumes:
      - ./src:/app/src

  clone-links-worker:
    # Same as the worker: no reloader, restart it after changing run code.
    environment:
      # 2 instead of the production 5, for the same reason as the worker.
      - OFM_CLONE_LINKS_WORKERS=2
    dns: *public-dns
    volumes:
      - ./src:/app/src

  preview-worker:
    # Same as the worker: no reloader, restart it after changing preview code.
    dns: *public-dns
    volumes:
      - ./src:/app/src

  migrate:
    # Migrates from the working tree: revision files and models without a
    # rebuild.
    dns: *public-dns
    volumes:
      - ./src:/app/src
      - ./alembic:/app/alembic

  postgres:
    ports:
      # Bound to localhost, not 0.0.0.0 -- host-run pytest/alembic reach it,
      # the rest of the network does not.
      - "127.0.0.1:5432:5432"

  redis:
    ports:
      - "127.0.0.1:6379:6379"

  # Every test/lint/type check, inside Linux:
  #   docker compose -f docker-compose.yml -f docker-compose.dev.yml run --rm tests
  #   docker compose ... run --rm tests uv run --frozen pytest -m e2e    (starts its own app)
  #   docker compose ... run --rm tests uv run --frozen pytest -m live   (real services)
  #   docker compose ... run --rm tests uv run --frozen mypy
  #   docker compose ... run --rm tests uv run --frozen pre-commit run --all-files
  tests:
    build:
      context: .
      target: test
    profiles:
      - test
    working_dir: /app
    command: ["uv", "run", "--frozen", "pytest", "-n", "auto", "--maxprocesses=8", "--dist", "loadgroup"]
    dns: *public-dns
    environment:
      # Their own servers (below), never the dev database or Redis.
      - OFM_TEST_DATABASE_URL=postgresql+psycopg://ofmhelpers:ofmhelpers@postgres-test:5432/ofmhelpers_test
      - OFM_TEST_REDIS_URL=redis://redis-test:6379/1
      # The image never writes bytecode (fine for a deploy); here every run
      # would recompile the whole app from the slow Windows bind mount, so
      # it is kept in a volume of its own instead.
      - PYTHONDONTWRITEBYTECODE=
      - PYTHONPYCACHEPREFIX=/pycache
    volumes:
      - .:/app
      # Already inside the checkout mount; named so the reports'
      # destination on the host is explicit (scripts/test.sh writes here).
      - ./reports:/app/reports
      - test_pycache:/pycache
    networks:
      - internal
    depends_on:
      postgres-test:
        condition: service_healthy
      redis-test:
        condition: service_healthy

  # The suite's own Postgres and Redis: in memory, nothing persisted, no
  # fsync -- they hold nothing worth keeping, so every write (and the
  # TRUNCATE before each test) is as cheap as it gets, and no test can
  # reach the dev data.
  postgres-test:
    image: postgres:16
    profiles:
      - test
    environment:
      - POSTGRES_USER=ofmhelpers
      - POSTGRES_PASSWORD=ofmhelpers
      - POSTGRES_DB=ofmhelpers_test
    command:
      - postgres
      - -c
      - fsync=off
      - -c
      - synchronous_commit=off
      - -c
      - full_page_writes=off
      - -c
      - max_connections=300
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ofmhelpers"]
      interval: 2s
      timeout: 3s
      retries: 30
    networks:
      - internal

  redis-test:
    image: redis:7
    profiles:
      - test
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30
    networks:
      - internal

  # Allure CLI: scripts/test.sh generates the report with it. Java stays in
  # this image.
  allure:
    build:
      context: .
      target: allure
    profiles:
      - test
    working_dir: /app
    volumes:
      - ./reports:/app/reports

  # RQ job dashboard. Reuses the app image (rq-dashboard is a project
  # dependency) so there is no extra unpinned third-party image to trust.
  rq-dashboard:
    build: .
    container_name: ofmhelpers-rq-dashboard
    profiles:
      - dev
    command:
      - rq-dashboard
      - --redis-url
      - redis://redis:6379/0
      - --bind
      - 0.0.0.0
      - --port
      - "9181"
    ports:
      - "127.0.0.1:9181:9181"
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - internal
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

volumes:
  test_pycache:
