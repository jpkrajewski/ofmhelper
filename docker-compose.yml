# PRODUCTION stack. This file alone is what runs on the server -- it is
# deliberately the boring, safe half: code comes from the image, nothing
# hot-reloads, no database port is published, no dev tooling.
#
# Local development layers docker-compose.dev.yml on top:
#
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d
#
# The overlay is never auto-loaded (it is not named docker-compose.override.yml
# on purpose), so forgetting the flags degrades a dev box to production
# behaviour -- annoying but harmless. The reverse mistake is the one that hurt:
# the server used to run with ./src bind-mounted and uvicorn --reload, so a
# `git reset --hard` went live in the running container minutes before its
# Alembic migration did, and /models 500ed until the migration caught up
# (2026-07-27). Both deploy paths pass `-f docker-compose.yml` explicitly so a
# stray overlay on the server can never re-enable that. Migrations are part of
# the stack itself now: the `migrate` service runs `alembic upgrade head` and
# the app and worker only start once it has exited 0.
#
# Shared app config, reused by the API and the RQ worker via YAML anchors so
# the worker always mounts exactly the same filesystem the API serves results
# from (uploads/kieai_out/downloads) and reads the same env.
x-app-environment: &app-environment
  BGUTIL_POT_PROVIDER_URL: http://pot-provider:4416
  OFM_COOKIES_FILE: /app/cookies/cookies.txt
  # Inside the uploads mount: the asset store's copy of each result is then
  # a hard link, not a second file (two mounts cannot link: prod
  # 2026-11-11, 17.5 GB of the 72 GB disk was every result twice). The old
  # ./kieai_out mount stays: earlier jobs name files there.
  OFM_KIEAI_OUT_DIR: /app/uploads/kieai_out
  # Postgres (durable job/application store) and Redis (RQ broker). The code
  # defaults these to the service names, but we set them explicitly so the same
  # file documents the wiring on any host. The passwords: POSTGRES_PASSWORD
  # and REDIS_PASSWORD from the environment or .env, required (no default:
  # a known one let any container on the network in; security audit
  # 2026-11-18). `openssl rand -hex 32` each: hex, so they need no URL
  # escaping. The deploy sets the database user's password to
  # POSTGRES_PASSWORD every time (`ALTER ROLE`), so a new value in .env is
  # all a rotation takes.
  OFM_DATABASE_URL: postgresql+psycopg://ofmhelpers:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/ofmhelpers
  OFM_REDIS_URL: redis://:${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}@redis:6379/0
  # What is running, on every trace (telemetry.py): both deploy paths export
  # the deployed commit; anything else (dev, a manual `up`) says "dev".
  OFM_RELEASE: ${OFM_RELEASE:-dev}

# The server keeps ONE .env. The web service and the services that hold the
# same keys anyway (worker, sweeps, media-worker) take the whole file
# (env_file:), so no setting silently falls back to its code default. The two
# services that decode uploaded media (preview-worker, edit-worker) and the
# migration take no file: they get names only, so they never hold a provider
# key, the vault key or the session secret (security audit 2026-11-18, item
# 215). They still hold the database and Redis URLs above, with their
# passwords: a worker writes job rows and takes its jobs from RQ. A name with
# no value below is passed in from .env (unset there = not set in the
# container). tests/unit/test_worker_services.py fails when a setting the
# edit or preview tasks read is missing from the list, or a secret reaches
# them.
x-env-runtime: &env-runtime
  OFM_ENV:
  LOGFIRE_TOKEN:
  SENTRY_DSN:
  OFM_LOG_LEVEL:
  OFM_LOG_FORMAT:
  OFM_LOG_ACCESS:
  OFM_TELEMETRY_FLUSH_S:
  OFM_RQ_ASYNC:
  OFM_RQ_JOB_TIMEOUT_S:
  OFM_RQ_WORKERS:
  OFM_PREVIEW_WORKERS:
  OFM_CLONE_LINKS_WORKERS:
  OFM_MEDIA_WORKERS:
  OFM_EVENTS_WORKERS:
  OFM_EDIT_WORKERS:
  OFM_UPLOADS_ROOT:
