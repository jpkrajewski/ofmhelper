# PRODUCTION stack. This file alone is what runs on the server -- it is
# deliberately the boring, safe half: code comes from the image, nothing
# hot-reloads, no database port is published, no dev tooling.
#
# Local development layers docker-compose.dev.yml on top:
#
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d
#
# The overlay is never auto-loaded (it is not named docker-compose.override.yml
# on purpose), so forgetting the flags degrades a dev box to production
# behaviour -- annoying but harmless. The reverse mistake is the one that hurt:
# the server used to run with ./src bind-mounted and uvicorn --reload, so a
# `git reset --hard` went live in the running container minutes before its
# Alembic migration did, and /models 500ed until the migration caught up
# (2026-07-27). Both deploy paths pass `-f docker-compose.yml` explicitly so a
# stray overlay on the server can never re-enable that. Migrations are part of
# the stack itself now: the `migrate` service runs `alembic upgrade head` and
# the app and worker only start once it has exited 0.
#
# Shared app config, reused by the API and the RQ worker via YAML anchors so
# the worker always mounts exactly the same filesystem the API serves results
# from (uploads/kieai_out/downloads) and reads the same env.
x-app-environment: &app-environment
  - BGUTIL_POT_PROVIDER_URL=http://pot-provider:4416
  - OFM_COOKIES_FILE=/app/cookies/cookies.txt
  - OFM_KIEAI_OUT_DIR=/app/kieai_out
  - OFM_KIEAI_TASK_LOG=/app/kieai_out/tasks.jsonl
  - OFM_KIEAI_COMPLETIONS_LOG=/app/kieai_out/completions.jsonl
  # Postgres (durable job/application store) and Redis (RQ broker). The code
  # defaults these to the service names, but we set them explicitly so the same
  # file documents the wiring on any host.
  - OFM_DATABASE_URL=postgresql+psycopg://ofmhelpers:ofmhelpers@postgres:5432/ofmhelpers
  - OFM_REDIS_URL=redis://redis:6379/0
  # What is running, on every trace (telemetry.py): both deploy paths export
  # the deployed commit; anything else (dev, a manual `up`) says "dev".
  - OFM_RELEASE=${OFM_RELEASE:-dev}

x-app-volumes: &app-volumes
  # No ./src mount here -- production runs the code baked into the image, so a
  # checkout on the server changes nothing until the image is rebuilt. The dev
  # overlay adds the mount back.
  - cookies_data:/app/cookies
  - ./uploads:/app/uploads
  - ./downloads:/app/downloads
  - ./kieai_out:/app/kieai_out

services:
  ofmhelpers:
    build: .
    container_name: ofmhelpers
    restart: unless-stopped
    ports:
      # Loopback only: nginx on the host terminates :80 and proxies here, so
      # the app itself is never reachable from the internet. Docker publishes
      # straight into iptables and would otherwise sail past ufw.
      - "127.0.0.1:8000:8000"
    environment: *app-environment
    env_file:
      - .env
    volumes: *app-volumes
    # A stop waits for the sweeps' threads: the Telegram read (`telegram asks`)
    # waits up to OFM_TELEGRAM_ASK_WAIT_S (10 s) for a message. Docker's 10 s
    # default killed the app mid-read about half the time.
    stop_grace_period: 30s
    depends_on:
      # Never against an un-migrated database: `migrate` must have exited 0.
      migrate:
        condition: service_completed_successfully
      pot-provider:
        condition: service_started
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - internal
    security_opt:
      - no-new-privileges:true
    read_only: false   # set true if your app doesn't write outside ./uploads
    cap_drop:
      - ALL
    cap_add:
      - DAC_OVERRIDE   # lets appuser (1000:1000) write to bind mounts it
                        # doesn't literally own -- needed on Windows/Docker
                        # Desktop bind mounts where real chown isn't reliable

  # RQ worker: runs the background jobs the API used to run in-process. A pool
  # of processes (default 10, OFM_RQ_WORKERS to tune) so at least 10 upload/
  # poll/download jobs run concurrently. Its own restart policy, independent of
  # the API -- a worker crash must not take down the web app, and vice versa.
  worker:
    build: .
    container_name: ofmhelpers-worker
    restart: unless-stopped
    # Runs RQ via ofmhelpers.worker so the pool starts with the app's logging
    # configured (see ofmhelpers/log.py); it reads OFM_RQ_WORKERS/OFM_REDIS_URL
    # from settings itself, so no shell is needed to expand them -- exec form
    # also keeps signals going straight to the process.
    command: ["python", "-m", "ofmhelpers.worker"]
    # `compose stop` (every deploy) is a warm shutdown: the pool takes no new
    # job and each worker finishes the one it runs. Docker's default 10 s
    # SIGKILLed /clone-links reviews mid-LLM-call or mid-upload; 120 s lets
    # them finish. A generation still running then is cut off and resumed by
    # recovery (features/jobs/recovery.py). The deploys stop the workers before the
    # app, so this wait is not downtime.
    stop_grace_period: 120s
    # The image's HTTP healthcheck (probes :8000/health) is meaningless for the
    # worker, which runs no web server -- disable it so status isn't "unhealthy".
    healthcheck:
      disable: true
    environment: *app-environment
    env_file:
      - .env
    volumes: *app-volumes
    depends_on:
      # Never against an un-migrated database: `migrate` must have exited 0.
      migrate:
        condition: service_completed_successfully
      pot-provider:
        condition: service_started
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - internal
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - DAC_OVERRIDE

  # /clone-links runs (features/clone_links/run.py) on their own
  # `clone-links` queue and pool (OFM_CLONE_LINKS_WORKERS, default 5): a
  # 30-120 link Generate holds a worker per run for minutes each, and on the
  # shared default queue it held every other job back for hours. Otherwise
  # the same as `worker` (image, env, mounts, shutdown).
  clone-links-worker:
    build: .
    container_name: ofmhelpers-clone-links-worker
    restart: unless-stopped
    command: ["python", "-m", "ofmhelpers.worker", "clone-links"]
    stop_grace_period: 120s
    healthcheck:
      disable: true
    environment: *app-environment
    env_file:
      - .env
    volumes: *app-volumes
    depends_on:
      migrate:
        condition: service_completed_successfully
      pot-provider:
        condition: service_started
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - internal
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - DAC_OVERRIDE

  # Local encodes of big videos (`QueueName.MEDIA`: /trials copies). One
  # process, so one encode at a time, first in first out, however many wait: a
  # 4K copy holds 1.5 GB, and six at once on prod's 7.75 GB had the kernel
  # killing them (2026-11-04). Lowest priority (`InfraSettings.queues`) on 3 of 4
  # cores: the site stays quick.
  media-worker:
    build: .
    container_name: ofmhelpers-media-worker
    restart: unless-stopped
    command: ["python", "-m", "ofmhelpers.worker", "media"]
    cpus: 3.0
    stop_grace_period: 120s
    healthcheck:
      disable: true
    environment: *app-environment
    env_file:
      - .env
    volumes: *app-volumes
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - internal
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - DAC_OVERRIDE

  # /edit cuts (features/edit), one at a time (`OFM_EDIT_WORKERS` 1): its own
  # worker so a cut never waits behind a /trials batch on media, and its own CPU
  # and RAM cap so an ffmpeg that runs away is killed in here, never Postgres.
  # 3 CPUs: a 14 s 1440p 60 fps cut takes 15 s at 1.5, 7 s at 3 (2026-11-06).
  edit-worker:
    build: .
    container_name: ofmhelpers-edit-worker
    restart: unless-stopped
    command: ["python", "-m", "ofmhelpers.worker", "edit"]
    cpus: 3.0
    mem_limit: 2g
    stop_grace_period: 120s
    healthcheck:
      disable: true
    environment: *app-environment
    env_file:
      - .env
    volumes: *app-volumes
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - internal
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - DAC_OVERRIDE

  # Events going out to the senders (features/events: Telegram, ...), seconds each.
  # Its own queue at the top priority, one process (`OFM_EVENTS_WORKERS`): they go
  # out in order, and never wait behind a 45-min generation on the default queue.
  events-worker:
    build: .
    container_name: ofmhelpers-events-worker
    restart: unless-stopped
    command: ["python", "-m", "ofmhelpers.worker", "events"]
    stop_grace_period: 120s
    healthcheck:
      disable: true
    environment: *app-environment
    env_file:
      - .env
    volumes: *app-volumes
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - internal
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - DAC_OVERRIDE

  # Gallery previews (features/previews/render.py): one ffmpeg encode at a
  # time, at low CPU priority and capped at two cores, so a backlog (every old
  # result after a deploy) never slows the app or the generation workers.
  preview-worker:
    build: .
    container_name: ofmhelpers-preview-worker
    restart: unless-stopped
    command: ["python", "-m", "ofmhelpers.worker", "previews"]
    cpus: 2.0
    healthcheck:
      disable: true
    environment: *app-environment
    env_file:
      - .env
    volumes: *app-volumes
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - internal
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - DAC_OVERRIDE

  # Brings the database to the newest Alembic revision, then exits. The app
  # and the worker depend on it completing successfully, so every `up` --
  # dev, a deploy, a fresh server -- migrates first and never starts new
  # code on an old schema (or any code on a half-migrated one).
  migrate:
    build: .
    container_name: ofmhelpers-migrate
    restart: "no"
    command: ["alembic", "upgrade", "head"]
    healthcheck:
      disable: true
    environment: *app-environment
    env_file:
      - .env
    # Read-only: alembic b1c2d3e4f5a7 moves the old shared cookies.txt into
    # the password admin's own cookies (user_cookies) and leaves the file.
    volumes:
      - cookies_data:/app/cookies:ro
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - internal
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  postgres:
    image: postgres:16
    container_name: ofmhelpers-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_USER=ofmhelpers
      - POSTGRES_PASSWORD=ofmhelpers
      - POSTGRES_DB=ofmhelpers
    # No published port in production: nothing off the compose network needs to
    # reach the database, and `docker compose exec postgres psql -U ofmhelpers`
    # covers ad-hoc queries. The dev overlay publishes 127.0.0.1:5432 for
    # host-run pytest/alembic.
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ofmhelpers"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal
    security_opt:
      - no-new-privileges:true

  redis:
    image: redis:7
    container_name: ofmhelpers-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    # Same as postgres: published only by the dev overlay, for host-run tests.
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal
    security_opt:
      - no-new-privileges:true
    # No `cap_drop: ALL` here: the redis image's entrypoint uses setpriv to
    # step down from root to the redis user, which needs SETUID/SETGID.
    # Dropping all caps makes it crash-loop ("setpriv: setresuid failed").
    # Same reason postgres above keeps default caps.

  pot-provider:
    image: brainicism/bgutil-ytdlp-pot-provider:latest
    container_name: bgutil-pot-provider
    restart: unless-stopped
    expose:
      - "4416"
    networks:
      - internal
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  # rq-dashboard lives in docker-compose.dev.yml -- it has no place in a
  # production stack.

volumes:
  cookies_data:
  postgres_data:
  redis_data:

networks:
  internal:
    driver: bridge
