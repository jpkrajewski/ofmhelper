# One image for every app service, named by the commit it was built from: both
# deploy paths export OFM_RELEASE, tag the build with it and keep the one
# before (README "Deploying": an earlier commit is deployed from its kept
# image). Anything else (dev, a manual `up`) builds and runs `:dev`.
x-app-image: &app-image ofmhelpers-app:${OFM_RELEASE:-dev}

x-app-volumes: &app-volumes
  # No ./src mount here -- production runs the code baked into the image, so a
  # checkout on the server changes nothing until the image is rebuilt. The dev
  # overlay adds the mount back.
  - cookies_data:/app/cookies
  - ./uploads:/app/uploads
  - ./downloads:/app/downloads
  - ./kieai_out:/app/kieai_out

services:
  ofmhelpers:
    build: .
    image: *app-image
    container_name: ofmhelpers
    restart: unless-stopped
    ports:
      # Loopback only: nginx on the host terminates :80 and proxies here, so
      # the app itself is never reachable from the internet. Docker publishes
      # straight into iptables and would otherwise sail past ufw.
      - "127.0.0.1:8000:8000"
    environment: *app-environment
    env_file:
      - .env
    volumes: *app-volumes
    depends_on:
      # Never against an un-migrated database: `migrate` must have exited 0.
      migrate:
        condition: service_completed_successfully
      pot-provider:
        condition: service_started
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - internal
      - pot
    security_opt:
      - no-new-privileges:true
    read_only: false   # set true if your app doesn't write outside ./uploads
    cap_drop:
      - ALL
    cap_add:
      - DAC_OVERRIDE   # lets appuser (1000:1000) write to bind mounts it
                        # doesn't literally own -- needed on Windows/Docker
                        # Desktop bind mounts where real chown isn't reliable

  # RQ worker: runs the background jobs the API used to run in-process. A pool
  # of processes (default 10, OFM_RQ_WORKERS to tune) so at least 10 upload/
  # poll/download jobs run concurrently. Its own restart policy, independent of
  # the API -- a worker crash must not take down the web app, and vice versa.
  worker:
    build: .
    image: *app-image
    restart: unless-stopped
    # Runs RQ via ofmhelpers.background.worker so the pool starts with the app's logging
    # configured (see ofmhelpers/log.py); it reads OFM_RQ_WORKERS/OFM_REDIS_URL
    # from settings itself, so no shell is needed to expand them -- exec form
    # also keeps signals going straight to the process.
    # Three queues, each its own pool in here (`worker.QueueGroup`), so none
    # waits behind another: `default` (OFM_RQ_WORKERS 10), `clone-links`
    # (OFM_CLONE_LINKS_WORKERS 5: a 30-120 link Generate held every other job
    # back for hours on the default queue) and `events` (OFM_EVENTS_WORKERS 1:
    # a Telegram message never waits behind a 45-min generation). One
    # container, not three: all of it is network work, and each container
    # held the app's code again (~210 MB idle each, prod 2026-11-11).
    command: ["python", "-m", "ofmhelpers.background.worker", "default", "clone-links", "events"]
    # `compose stop` (every deploy) is a warm shutdown: the pool takes no new
    # job and each worker finishes the one it runs. Docker's default 10 s
    # SIGKILLed /clone-links reviews mid-LLM-call or mid-upload; 120 s lets
    # them finish. A generation still running then is cut off and resumed by
    # recovery (background/recovery.py). The deploys stop the workers before the
    # app, so this wait is not downtime.
    stop_grace_period: 120s
    # The image's HTTP healthcheck (probes :8000/health) is meaningless for the
    # worker, which runs no web server -- disable it so status isn't "unhealthy".
    healthcheck:
      disable: true
    environment: *app-environment
    env_file:
      - .env
    volumes: *app-volumes
    depends_on:
      # Never against an un-migrated database: `migrate` must have exited 0.
      migrate:
        condition: service_completed_successfully
      pot-provider:
        condition: service_started
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - internal
      - pot
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - DAC_OVERRIDE

  # The background sweeps (background/sweeps.py: recovery, due rescans,
  # Drive, chats, the daily report), in a process of their own: exactly one,
  # however many web processes serve. They ran inside the web process until
  # 2026-11-11, where a second one would have run every sweep twice. One
  # Python process, threads only: the work itself goes to the workers.
  sweeps:
    build: .
    image: *app-image
    restart: unless-stopped
    command: ["python", "-m", "ofmhelpers.background.sweeps"]
    # A stop waits for the sweeps' threads: the Telegram read (`telegram asks`)
    # waits up to OFM_TELEGRAM_ASK_WAIT_S (10 s) for a message. Docker's 10 s
    # default killed it mid-read about half the time.
    stop_grace_period: 30s
    healthcheck:
      disable: true
    environment: *app-environment
    env_file:
      - .env
    volumes: *app-volumes
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - internal
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - DAC_OVERRIDE

  # Local encodes of big videos (`QueueName.MEDIA`: /trials copies). One
  # process, so one encode at a time, first in first out, however many wait: a
  # 4K copy holds 1.5 GB, and six at once on prod's 7.75 GB had the kernel
  # killing them (2026-11-04). Lowest priority (`InfraSettings.queues`) on 3 of 4
  # cores: the site stays quick.
  media-worker:
    build: .
    image: *app-image
    restart: unless-stopped
    command: ["python", "-m", "ofmhelpers.background.worker", "media"]
    cpus: 3.0
    stop_grace_period: 120s
    healthcheck:
      disable: true
    environment: *app-environment
    env_file:
      - .env
    volumes: *app-volumes
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - internal
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - DAC_OVERRIDE

  # /edit cuts (features/edit), one at a time (`OFM_EDIT_WORKERS` 1): its own
  # worker so a cut never waits behind a /trials batch on media, and its own CPU
  # and RAM cap so an ffmpeg that runs away is killed in here, never Postgres.
  # 3 CPUs: a 14 s 1440p 60 fps cut takes 15 s at 1.5, 7 s at 3 (2026-11-06).
  edit-worker:
    build: .
    image: *app-image
    restart: unless-stopped
    command: ["python", "-m", "ofmhelpers.background.worker", "edit"]
    cpus: 3.0
    mem_limit: 2g
    stop_grace_period: 120s
    healthcheck:
      disable: true
    environment:
      <<: [*app-environment, *env-runtime, *env-reachable]
    volumes: *app-volumes
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - internal
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - DAC_OVERRIDE

  # Gallery previews (features/previews/render.py): one ffmpeg encode at a
  # time, at low CPU priority and capped at two cores, so a backlog (every old
  # result after a deploy) never slows the app or the generation workers.
  preview-worker:
    build: .
    image: *app-image
    restart: unless-stopped
    command: ["python", "-m", "ofmhelpers.background.worker", "previews"]
    cpus: 2.0
    # As the other workers: the encode it runs finishes on `compose stop`.
    stop_grace_period: 120s
    healthcheck:
      disable: true
    environment:
      <<: [*app-environment, *env-runtime, *env-reachable]
    volumes: *app-volumes
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - internal
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - DAC_OVERRIDE

  # Brings the database to the newest Alembic revision, then exits. The app
  # and the worker depend on it completing successfully, so every `up` --
  # dev, a deploy, a fresh server -- migrates first and never starts new
  # code on an old schema (or any code on a half-migrated one).
  migrate:
    build: .
    image: *app-image
    container_name: ofmhelpers-migrate
    restart: "no"
    command: ["alembic", "upgrade", "head"]
    healthcheck:
      disable: true
    environment:
      <<: [*app-environment]
      OFM_ENV:
      OFM_PHONES_BACKUP_KEEP:
      OFM_PHONES_BACKUP_SWEEP_S:
      OFM_PHONES_HISTORY_LIMIT:
    # Read-only: alembic b1c2d3e4f5a7 moves the old shared cookies.txt into
    # the password admin's own cookies (user_cookies) and leaves the file.
    volumes:
      - cookies_data:/app/cookies:ro
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - internal
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  postgres:
    image: postgres:16@sha256:33f923b05f64ca54ac4401c01126a6b92afe839a0aa0a52bc5aeb5cc958e5f20
    container_name: ofmhelpers-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_USER=ofmhelpers
      # Only read when the volume is first made; on a volume that already
      # exists the deploy's `ALTER ROLE` makes it the user's password.
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      - POSTGRES_DB=ofmhelpers
    # No published port in production: nothing off the compose network needs to
    # reach the database, and `docker compose exec postgres psql -U ofmhelpers`
    # covers ad-hoc queries. The dev overlay publishes 127.0.0.1:5432 for
    # host-run pytest/alembic.
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ofmhelpers"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal
    security_opt:
      - no-new-privileges:true

  redis:
    image: redis:7@sha256:a8f08480e1f88f2647fed492d1178c06abb0d0c1fbf02c682a61e2f483fb3954
    container_name: ofmhelpers-redis
    restart: unless-stopped
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --requirepass
      - ${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}
    environment:
      # redis-cli (the healthcheck, `exec redis redis-cli`) signs in with it.
      - REDISCLI_AUTH=${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}
    # Same as postgres: published only by the dev overlay, for host-run tests.
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal
    security_opt:
      - no-new-privileges:true
    # No `cap_drop: ALL` here: the redis image's entrypoint uses setpriv to
    # step down from root to the redis user, which needs SETUID/SETGID.
    # Dropping all caps makes it crash-loop ("setpriv: setresuid failed").
    # Same reason postgres above keeps default caps.

  pot-provider:
    # The digest prod ran on 2026-11-11, so dev and a rebuilt server run the
    # same build (`:latest` alone moved under us). The tag is kept for
    # Renovate, which proposes the next digest (renovate.json "downloaders").
    image: brainicism/bgutil-ytdlp-pot-provider:latest@sha256:d7d34108b76e52c7d3b575fe9e797e4bf41c1b2a08f80c5292eff6f851ce8472
    container_name: bgutil-pot-provider
    restart: unless-stopped
    expose:
      - "4416"
    # A third-party image: on its own network with only the two services
    # that call it (yt-dlp in the app and the default worker), never next to
    # Postgres and Redis (security audit 2026-11-18).
    networks:
      - pot
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  # rq-dashboard lives in docker-compose.dev.yml -- it has no place in a
  # production stack.

volumes:
  cookies_data:
  postgres_data:
  redis_data:

networks:
  internal:
    driver: bridge
  pot:
    driver: bridge
