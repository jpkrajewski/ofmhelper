# PRODUCTION stack. This file alone is what runs on the server -- it is
# deliberately the boring, safe half: code comes from the image, nothing
# hot-reloads, no database port is published, no dev tooling.
#
# Local development layers docker-compose.dev.yml on top:
#
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d
#
# The overlay is never auto-loaded (it is not named docker-compose.override.yml
# on purpose), so forgetting the flags degrades a dev box to production
# behaviour -- annoying but harmless. The reverse mistake is the one that hurt:
# the server used to run with ./src bind-mounted and uvicorn --reload, so a
# `git reset --hard` went live in the running container minutes before its
# Alembic migration did, and /models 500ed until the migration caught up
# (2026-07-27). Both deploy paths pass `-f docker-compose.yml` explicitly so a
# stray overlay on the server can never re-enable that.
#
# Shared app config, reused by the API and the RQ worker via YAML anchors so
# the worker always mounts exactly the same filesystem the API serves results
# from (uploads/kieai_out/downloads) and reads the same env.
x-app-environment: &app-environment
  - BGUTIL_POT_PROVIDER_URL=http://pot-provider:4416
  - OFM_COOKIES_FILE=/app/cookies/cookies.txt
  - OFM_KIEAI_OUT_DIR=/app/kieai_out
  - OFM_KIEAI_TASK_LOG=/app/kieai_out/tasks.jsonl
  - OFM_KIEAI_COMPLETIONS_LOG=/app/kieai_out/completions.jsonl
  - GOOGLE_DRIVE_TOKEN_FILE=/app/secrets/google-drive-token.json
  # Postgres (durable job/todo/token store) and Redis (RQ broker). The code
  # defaults these to the service names, but we set them explicitly so the same
  # file documents the wiring on any host.
  - OFM_DATABASE_URL=postgresql+psycopg://ofmhelpers:ofmhelpers@postgres:5432/ofmhelpers
  - OFM_REDIS_URL=redis://redis:6379/0

x-app-volumes: &app-volumes
  # No ./src mount here -- production runs the code baked into the image, so a
  # checkout on the server changes nothing until the image is rebuilt. The dev
  # overlay adds the mount back.
  - cookies_data:/app/cookies
  - ./uploads:/app/uploads
  - ./downloads:/app/downloads
  - ./kieai_out:/app/kieai_out
  - ./secrets:/app/secrets   # writable -- the Drive OAuth token file rewrites
                              # itself on every refresh (see gdrive/client.py);
                              # read-only broke that

services:
  ofmhelpers:
    build: .
    container_name: ofmhelpers
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment: *app-environment
    env_file:
      - .env
    volumes: *app-volumes
    depends_on:
      pot-provider:
        condition: service_started
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - internal
    security_opt:
      - no-new-privileges:true
    read_only: false   # set true if your app doesn't write outside ./uploads
    cap_drop:
      - ALL
    cap_add:
      - DAC_OVERRIDE   # lets appuser (1000:1000) write to bind mounts it
                        # doesn't literally own -- needed on Windows/Docker
                        # Desktop bind mounts where real chown isn't reliable

  # RQ worker: runs the background jobs the API used to run in-process. A pool
  # of processes (default 10, OFM_RQ_WORKERS to tune) so at least 10 upload/
  # poll/download jobs run concurrently. Its own restart policy, independent of
  # the API -- a worker crash must not take down the web app, and vice versa.
  worker:
    build: .
    container_name: ofmhelpers-worker
    restart: unless-stopped
    # Runs RQ via ofmhelpers.worker so the pool starts with the app's logging
    # configured (see ofmhelpers/log.py); it reads OFM_RQ_WORKERS/OFM_REDIS_URL
    # from settings itself, so no shell is needed to expand them -- exec form
    # also keeps signals going straight to the process.
    command: ["python", "-m", "ofmhelpers.worker"]
    # The image's HTTP healthcheck (probes :8000/health) is meaningless for the
    # worker, which runs no web server -- disable it so status isn't "unhealthy".
    healthcheck:
      disable: true
    environment: *app-environment
    env_file:
      - .env
    volumes: *app-volumes
    depends_on:
      pot-provider:
        condition: service_started
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - internal
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - DAC_OVERRIDE

  postgres:
    image: postgres:16
    container_name: ofmhelpers-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_USER=ofmhelpers
      - POSTGRES_PASSWORD=ofmhelpers
      - POSTGRES_DB=ofmhelpers
    # No published port in production: nothing off the compose network needs to
    # reach the database, and `docker compose exec postgres psql -U ofmhelpers`
    # covers ad-hoc queries. The dev overlay publishes 127.0.0.1:5432 for
    # host-run pytest/alembic.
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ofmhelpers"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal
    security_opt:
      - no-new-privileges:true

  redis:
    image: redis:7
    container_name: ofmhelpers-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    # Same as postgres: published only by the dev overlay, for host-run tests.
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal
    security_opt:
      - no-new-privileges:true
    # No `cap_drop: ALL` here: the redis image's entrypoint uses setpriv to
    # step down from root to the redis user, which needs SETUID/SETGID.
    # Dropping all caps makes it crash-loop ("setpriv: setresuid failed").
    # Same reason postgres above keeps default caps.

  pot-provider:
    image: brainicism/bgutil-ytdlp-pot-provider:latest
    container_name: bgutil-pot-provider
    restart: unless-stopped
    expose:
      - "4416"
    networks:
      - internal
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  # rq-dashboard lives in docker-compose.dev.yml -- it has no place in a
  # production stack.

volumes:
  cookies_data:
  postgres_data:
  redis_data:

networks:
  internal:
    driver: bridge
